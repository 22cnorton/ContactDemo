services:
  db:
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres:/var/lib/postgresql
  app:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    volumes:
      - .:/src:Z,ro
      - /src/bin
      - /src/obj
      
volumes:
  dev_postgres:
