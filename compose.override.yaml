services:
  db:
    ports:
      - "1433:1433"
    volumes:
      - dev_db:/var/opt/mssql
  app:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    volumes:
      - .:/src:Z,ro
      - /src/bin
      - /src/obj
      
volumes:
  dev_db:
